name: Verify
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm check
      - run: pnpm --filter @soundor/components pack --pack-destination "$RUNNER_TEMP"

  # The demos' web build in Chromium (apps/demos/e2e/web): real layout, hit
  # testing and browser input, which the unit tests' runtime simulates.
  e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm --filter @soundor/components-demos exec playwright install --with-deps chromium
      - run: pnpm test:e2e

  # The demos' Debug VST3 in Soundor's VST3 host, its editor open under Xvfb
  # (apps/demos/e2e/vst3): the components bound to parameters, and the
  # gestures and edits a host records. Nothing built leaves the runner.
  vst3:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: sudo apt-get install -y --no-install-recommends xvfb
      - run: xvfb-run -a pnpm test:vst3

  # The one check to require in branch protection: it passes only when every
  # job above passed, so new jobs need no settings change, only this list.
  verify:
    name: Verify
    if: always()
    needs: [check, e2e, vst3]
    runs-on: ubuntu-24.04
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          jq -e 'all(. == "success")' <<< "$RESULTS"
