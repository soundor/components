name: Website

# components.soundor.dev: the static site apps/website builds (the docs, with
# the demos' web build), deployed to GitHub Pages.
#
# Release calls it once npm has the release, with the released commit, so the
# docs describe what is published; run it by hand to deploy a website-only
# change between releases (Actions → Website → Run workflow, or
# `gh workflow run website.yml -f ref=main`). A release's GITHUB_TOKEN cannot
# start other workflows, hence a call rather than `on: release`.

on:
  workflow_call:
    inputs:
      cache:
        description: Cache the pnpm store (disabled by Release)
        type: boolean
        default: true
      ref:
        description: The commit to build the site from
        type: string
        required: true
  workflow_dispatch:
    inputs:
      cache:
        description: Cache the pnpm store (disabled by Release)
        type: boolean
        default: true
      ref:
        description: Branch, tag or commit to deploy
        type: string
        default: main

# One deploy at a time; a newer one waits rather than cancelling.
concurrency:
  group: website-deploy
  cancel-in-progress: false

permissions: {}

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      UMAMI_WEBSITE_ID: ${{ vars.UMAMI_WEBSITE_ID }}
    steps:
      # The site carries Umami's tracker only when the build has a website
      # ID: the organization's UMAMI_WEBSITE_ID variable. Without it a deploy
      # would publish the site without analytics, so it stops here.
      - name: Check the analytics configuration
        run: |
          if [ -z "$UMAMI_WEBSITE_ID" ]; then
            echo "::error title=UMAMI_WEBSITE_ID is missing::The organization's Actions variable UMAMI_WEBSITE_ID is not set, or not visible to this repository (Organization settings → Secrets and variables → Actions → Variables). The website is not deployed without it."
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Setup
        uses: ./.github/actions/setup
        with:
          cache: ${{ inputs.cache }}

      # The package, the demos' web build, then the site; it fails on a broken
      # link or an incomplete page.
      - name: Build the site
        run: pnpm turbo run build --filter=@soundor/components-website

      - name: Check the tracker is in the site
        run: |
          if ! grep -q "data-website-id=\"$UMAMI_WEBSITE_ID\"" apps/website/dist/client/index.html; then
            echo "::error title=No analytics tracker::apps/website/dist/client/index.html has no tracker with UMAMI_WEBSITE_ID's website ID."
            exit 1
          fi

      - name: Upload the site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/website/dist/client

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
