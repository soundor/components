version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 10
    ignore:
      # The tested Soundor release is the package's compatibility target:
      # move it by hand, together with the peer range and a changeset.
      - dependency-name: '@soundor/*'
      - dependency-name: 'vitest-environment-soundor'
      # Bump the types to a new major together with Node in .nvmrc.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      pnpm-minor-and-patch:
        update-types:
          - minor
          - patch
      pnpm-major:
        update-types:
          - major
    labels:
      - dependencies
    commit-message:
      prefix: 'chore(deps)'

  - package-ecosystem: github-actions
    # The composite action under .github/actions pins actions too.
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 10
    groups:
      github-actions:
        patterns:
          - '*'
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: 'ci(deps)'
